<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>猪窝 1PIG'S</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- 启动页 -->

<div id="splash">

<div class="splash-logo">

<img src="assets/logo.png" class="logo-image">

<div class="logo-en">
1PIG'S
</div>


<div class="line"></div>


<div>
记录家的每一步
</div>


<div class="home-en">
BUILDING OUR HOME
</div>


</div>

</div>





<div id="app" class="hidden">



<header>

<div class="brand">

<h1>
我的家
</h1>


<p>
用心记录，慢慢成家
</p>


</div>


</header>





<main>




<!-- 首页 -->

<section id="home" class="page active">


<header class="home-header">

<div>

<h1>
我的家
</h1>

<p>
每一步，都是未来生活的样子
</p>

</div>


<img 
src="assets/logo.png"
class="home-logo">

</header>





<div class="card progress-card">


<div class="small">
当前阶段
</div>


<h2>
泥瓦施工阶段
</h2>



<div class="progress-info">


<div>

<span>
整体进度
</span>

<strong>
58%
</strong>


</div>



<div>

<span>
装修第
</span>

<strong>
42</strong>
天


</div>


</div>




<div class="progress">

<div class="progress-inner">

</div>

</div>



</div>







<div class="grid">



<button class="menu"
data-page="logs">

<div class="icon">
▤
</div>

<div>

施工日志

<small>
记录每天的进展
</small>

</div>

</button>




<button class="menu"
data-page="issues">

<div class="icon">
☷
</div>


<div>

问题清单

<small>
跟踪问题与解决
</small>

</div>

</button>





<button class="menu"
data-page="archive">


<div class="icon">
□
</div>


<div>

材料档案

<small>
材料清单与信息
</small>

</div>


</button>






<button class="menu"
data-page="contract">


<div class="icon">
▤
</div>


<div>

合同档案

<small>
合同与附件管理
</small>

</div>


</button>



</div>








<div class="section-title">


<h3>
装修进程
</h3>


<span>
查看全部 ＞
</span>


</div>





<div class="timeline card">


<div class="step done">


<div class="circle">
✓
</div>


<div>

<h4>
设计阶段
</h4>

<p>
已完成
</p>


</div>


</div>





<div class="step done">


<div class="circle">
✓
</div>


<div>

<h4>
拆除阶段
</h4>


<p>
已完成
</p>


</div>


</div>







<div class="step current">


<div class="circle">

</div>


<div>

<h4>
泥瓦施工阶段
</h4>


<p>
进行中
</p>


</div>


</div>







<div class="step">


<div class="circle">

</div>


<div>

<h4>
水电施工阶段
</h4>


<p>
未开始
</p>


</div>


</div>



</div>



</section>









<!-- 施工日志 -->


<section id="logs"
class="page">


<div class="page-title">

<button data-back="home">
‹
</button>


<h2>
施工日志
</h2>


</div>



<button class="add-btn"
data-page="newLog">

＋ 新增记录

</button>




<div id="logList">


</div>



</section>









<!-- 新增日志 -->


<section id="newLog"
class="page">


<div class="page-title">


<button data-back="logs">
‹
</button>


<h2>
新增施工日志
</h2>


</div>




<select id="logStage">

<option>
拆改
</option>

<option>
水电
</option>

<option>
泥瓦
</option>

<option>
木工
</option>

<option>
油漆
</option>

<option>
安装
</option>


</select>





<input id="logTitle"
placeholder="施工标题">





<textarea id="logContent"
placeholder="记录施工内容">
</textarea>




<input id="logImages"
type="file"
accept="image/*"
multiple>




<button id="saveLog"
class="save-btn">

保存记录

</button>




</section>









<!-- 日志详情 -->


<section id="detail"
class="page">


<div class="page-title">


<button data-back="logs">
‹
</button>


<h2>
日志详情
</h2>


</div>



<div id="detailBox">


</div>


</section>









<!-- 问题清单 -->


<section id="issues"
class="page">


<div class="page-title">

<button data-back="home">
‹
</button>


<h2>
问题清单
</h2>


</div>



<div class="card">

暂无问题记录

</div>



</section>









<!-- 档案 -->


<section id="archive"
class="page">


<div class="page-title">

<button data-back="home">
‹
</button>


<h2>
材料档案

</h2>


</div>




<div class="card">

材料记录

</div>



<div class="card">

合同档案

</div>


</section>








<!-- 合同 -->


<section id="contract"
class="page">


<div class="page-title">

<button data-back="home">
‹
</button>


<h2>
合同档案
</h2>


</div>



<div class="card">

硬装施工合同

</div>


</section>





</main>







<nav>


<button data-page="home">
首页
</button>


<button data-page="logs">
日志
</button>


<button data-page="issues">
问题
</button>


<button data-page="archive">
档案
</button>



</nav>




</div>





<script src="js/storage.js"></script>

<script src="js/logs.js"></script>

<script src="app.js"></script>



</body>

</html>
