<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>猪窝 1PIG'S</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111111">
</head>

<body>

<!-- 启动画面 -->
<section id="splash" class="splash">

    <div class="logo-area">

        <img src="assets/logo.png" class="logo">

        <div class="brand-cn">
            猪窝
        </div>

        <div class="brand-en">
            1PIG'S
        </div>

        <div class="line"></div>

        <div class="slogan">
            记录家的每一步
        </div>

        <div class="sub">
            BUILDING OUR HOME
        </div>

        <div class="year">
            2026
        </div>

    </div>

</section>


<!-- 主程序 -->

<div id="app" class="hidden">


<header>

    <div class="title">
        猪窝
    </div>

    <div class="subtitle">
        我的家
    </div>

</header>


<main>


<!-- 首页 -->

<section id="home" class="page active">

<div class="card project">

<h2>我的家</h2>

<div class="stage">
    泥瓦施工阶段
</div>

<div class="days">
    装修第 0 天
</div>

</div>



<div class="card">

<div class="label">
装修进度
</div>

<div class="progress">
0%
</div>

</div>



<div class="card">

<div class="label">
已花费金额
</div>

<div class="money">
¥0
</div>

</div>



<div class="card">

<h3>
最近动态
</h3>

<div class="empty">
暂无装修记录
</div>

</div>



<div class="grid">


<button>
📅
<br>
施工日志
</button>


<button>
⚠️
<br>
问题清单
</button>


<button>
📦
<br>
材料档案
</button>


<button>
📄
<br>
合同档案
</button>


</div>


</section>



<!-- 日志 -->

<section id="logs" class="page">

<div class="card">

<h2>
施工日志
</h2>

<div class="empty">
暂无记录
</div>

</div>

</section>



<!-- 问题 -->

<section id="issues" class="page">

<div class="card">

<h2>
问题清单
</h2>

<div class="empty">
暂无问题
</div>

</div>

</section>



<!-- 档案 -->

<section id="archive" class="page">

<div class="card">

<h2>
档案
</h2>


<div class="archive-item">
📦 材料档案
</div>


<div class="archive-item">
📄 合同档案
</div>


<div class="archive-item">
💰 财务流水
</div>


</div>

</section>



<!-- 我的 -->

<section id="me" class="page">

<div class="card">

<h2>
我的
</h2>


<div class="archive-item">
🏠 房屋管理
</div>


<div class="archive-item">
☁️ 数据同步
</div>


<div class="archive-item">
📦 备份恢复
</div>


</div>

</section>



</main>



<nav>

<button data-page="home">
首页
</button>


<button data-page="logs">
日志
</button>


<button data-page="issues">
问题
</button>


<button data-page="archive">
档案
</button>


<button data-page="me">
我的
</button>

</nav>


</div>


<script src="app.js"></script>

</body>
</html>
