<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>猪窝</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:#111;color:#fff;padding:20px 16px 14px;position:sticky;top:0;z-index:3}h1{margin:0;font-size:22px}.sub{opacity:.7;font-size:12px;margin-top:4px}
nav{position:sticky;top:72px;z-index:2;background:#fff;display:flex;gap:7px;overflow:auto;padding:9px;border-bottom:1px solid #eee}nav button{border:0;border-radius:18px;padding:8px 13px;white-space:nowrap;background:#f0f1f3}nav button.on{background:#111;color:#fff}
main{max-width:700px;margin:auto;padding:12px}.page{display:none}.page.on{display:block}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #00000008}
h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;color:#777;display:block;margin-bottom:5px}
input,textarea,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:14px;background:#fff}textarea{min-height:75px}
.primary{width:100%;border:0;border-radius:11px;background:#111;color:#fff;padding:11px;margin-top:10px;font-size:14px}.secondary{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 10px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:#fafafa;border-radius:12px;padding:10px}.kpi b{display:block;font-size:18px;margin-top:3px}.muted{color:#888;font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.badge{font-size:11px;background:#f1f1f1;padding:4px 7px;border-radius:7px;display:inline-block;margin-top:4px}.empty{text-align:center;color:#999;padding:15px;font-size:13px}
@media(max-width:430px){.grid{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><h1>猪窝</h1><div class="sub">报价 · 合同 · 增项 · 沟通 · 验收</div></header>
<nav id="nav"><button class="on" data-p="home">首页</button><button data-p="quote">报价</button><button data-p="contract">合同</button><button data-p="change">增项</button><button data-p="notes">沟通</button><button data-p="settings">设置</button></nav>
<main>
<section id="home" class="page on"><div class="card"><h2>我的装修项目</h2><div class="kpi"><div><span class="muted">预算</span><b id="budget">¥95,000</b></div><div><span class="muted">增减项</span><b id="changes">¥0</b></div><div><span class="muted">待处理</span><b id="todo">0</b></div></div></div>
<div class="card"><h2>装修底线</h2><div class="row">增项先报价、书面确认，再施工</div><div class="row">品牌/型号未经同意不得替换</div><div class="row">隐蔽工程封闭前必须验收</div><div class="row">最终结算以双方确认记录为准</div></div></section>

<section id="quote" class="page"><div class="card"><h2>报价项目</h2><div class="grid"><div><label>项目</label><input id="qn"></div><div><label>金额</label><input id="qp" type="number"></div></div><label style="margin-top:9px">数量/单位</label><input id="qq"><label style="margin-top:9px">判断</label><select id="qs"><option>待核价</option><option>正常</option><option>偏高</option><option>容易增项</option><option>疑似漏项</option></select><button class="primary" onclick="addQuote()">保存</button></div><div class="card"><div id="ql"></div></div></section>

<section id="contract" class="page"><div class="card"><h2>合同检查项</h2><div class="grid"><div><label>检查项</label><input id="cn"></div><div><label>状态</label><select id="cs"><option>必须修改</option><option>待确认</option><option>已通过</option></select></div></div><label style="margin-top:9px">我的要求</label><textarea id="cr"></textarea><button class="primary" onclick="addContract()">保存</button></div><div class="card"><div id="cl"></div></div></section>

<section id="change" class="page"><div class="card"><h2>增项/减项</h2><div class="grid"><div><label>项目</label><input id="xn"></div><div><label>金额（减项填负数）</label><input id="xp" type="number"></div></div><label style="margin-top:9px">原因</label><textarea id="xr"></textarea><label style="margin-top:9px">状态</label><select id="xs"><option>待确认</option><option>已确认</option><option>拒绝</option></select><button class="primary" onclick="addChange()">保存</button></div><div class="card"><div id="xl"></div></div></section>

<section id="notes" class="page"><div class="card"><h2>沟通记录</h2><label>日期</label><input id="nd" type="date"><label style="margin-top:9px">项目</label><input id="nt"><label style="margin-top:9px">对方说了什么</label><textarea id="ns"></textarea><label style="margin-top:9px">我的决定/下一步</label><textarea id="nn"></textarea><button class="primary" onclick="addNote()">保存</button></div><div class="card"><div id="nl"></div></div></section>

<section id="settings" class="page"><div class="card"><h2>项目设置</h2><label>项目名称</label><input id="pn" value="我的装修项目"><label style="margin-top:9px">预算</label><input id="pb" type="number" value="95000"><label style="margin-top:9px">备注</label><textarea id="pm"></textarea><button class="primary" onclick="saveSettings()">保存设置</button></div><div class="card"><h2>手机使用</h2><p class="muted">在 Safari 打开后，点“分享”→“添加到主屏幕”，即可像 App 一样使用。数据保存在本机。</p><button class="secondary" onclick="exportData()">备份数据</button><button class="secondary" onclick="importData()">恢复数据</button><input id="file" type="file" accept=".json" hidden></div></section>
</main>
<script>
const K="zhuwoPWA";let d=JSON.parse(localStorage.getItem(K)||"null")||{name:"我的装修项目",budget:95000,memo:"",q:[],c:[["增项必须书面确认","未经我书面确认，不得施工或收费。","必须修改"],["品牌/型号不得随意替换","任何替换先取得书面同意。","必须修改"],["隐蔽工程封闭前验收","水电、防水、暗装花洒预埋等封闭前验收。","待确认"]],x:[],n:[]};
const save=()=>{localStorage.setItem(K,JSON.stringify(d));render()};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));document.getElementById(b.dataset.p).classList.add("on");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on")});
function addQuote(){if(!qn.value)return;d.q.push([qn.value,+qp.value||0,qq.value,qs.value]);qn.value=qp.value=qq.value="";save()}
function addContract(){if(!cn.value)return;d.c.push([cn.value,cr.value,cs.value]);cn.value=cr.value="";save()}
function addChange(){if(!xn.value)return;d.x.push([xn.value,+xp.value||0,xr.value,xs.value]);xn.value=xp.value=xr.value="";save()}
function addNote(){if(!nt.value)return;d.n.push([nd.value,nt.value,ns.value,nn.value]);nt.value=ns.value=nn.value="";save()}
function del(a,i){if(confirm("删除这条记录？")){d[a].splice(i,1);save()}}
function render(){
budget.textContent="¥"+(+d.budget||0).toLocaleString();let sum=d.x.reduce((a,x)=>a+x[1],0);changes.textContent="¥"+sum.toLocaleString();todo.textContent=d.q.filter(x=>x[3]!="正常").length+d.c.filter(x=>x[2]!="已通过").length+d.x.filter(x=>x[3]=="待确认").length;
ql.innerHTML=d.q.length?d.q.map((x,i)=>`<div class=row><span><b>${x[0]}</b><br><span class=muted>${x[2]}</span><br><span class=badge>${x[3]}</span></span><span>¥${x[1].toLocaleString()}<br><button class=secondary onclick="del('q',${i})">删除</button></span></div>`).join(""):"<div class=empty>还没有报价项目</div>";
cl.innerHTML=d.c.map((x,i)=>`<div class=row><span><b>${x[0]}</b><br><span class=muted>${x[1]}</span><br><span class=badge>${x[2]}</span></span><button class=secondary onclick="del('c',${i})">删除</button></div>`).join("");
xl.innerHTML=d.x.length?d.x.map((x,i)=>`<div class=row><span><b>${x[0]}</b><br><span class=muted>${x[2]}</span><br><span class=badge>${x[3]}</span></span><span>${x[1]>=0?"+":""}¥${x[1].toLocaleString()}<br><button class=secondary onclick="del('x',${i})">删除</button></span></div>`).join(""):"<div class=empty>还没有增减项</div>";
nl.innerHTML=d.n.length?d.n.slice().reverse().map((x,i)=>`<div class=row><span><b>${x[0]} · ${x[1]}</b><br>${x[2]}<br><span class=muted>下一步：${x[3]}</span></span></div>`).join(""):"<div class=empty>还没有沟通记录</div>";
pn.value=d.name;pb.value=d.budget;pm.value=d.memo
}
function saveSettings(){d.name=pn.value||"我的装修项目";d.budget=+pb.value||0;d.memo=pm.value;save()}
function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));let a=document.createElement("a");a.href=u;a.download="猪窝备份.json";a.click();URL.revokeObjectURL(u)}
function importData(){file.click()}file.onchange=e=>{let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save();alert("恢复成功")}catch{alert("备份文件无效")}};r.readAsText(e.target.files[0])}
render();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
