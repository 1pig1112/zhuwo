<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">


<title>猪窝 1PIG'S</title>


<link rel="stylesheet" href="css/style.css">


</head>


<body>



<!-- 启动页 -->

<div id="splash"
class="splash">


<div class="logo-box">

<div class="logo">
猪窝
</div>


<div class="en">
1PIG'S
</div>


<div class="line"></div>


<div>
记录家的每一步
</div>


</div>


</div>







<div id="app"
class="hidden">





<header>


<h1>
猪窝
</h1>


<p>
我的装修管家
</p>


</header>







<main>





<!-- 首页 -->

<section id="home"
class="page active">


<div class="card">

<h2>
我的家
</h2>


<div class="stage">
准备装修
</div>


<div class="muted">
装修第0天
</div>


</div>





<div class="card">


<div class="muted">
已花费金额
</div>


<div class="money">
¥0
</div>


</div>






<div class="card">


<h3>
最近动态
</h3>


<div id="recent">

暂无记录

</div>


</div>






<button class="primary"
data-page="logs">


📅 查看施工日志


</button>





</section>









<!-- 施工日志 -->

<section id="logs"
class="page">


<div class="top">


<button class="back"
data-back="home">

← 返回

</button>


<h2>
施工日志
</h2>


</div>




<button class="primary"
data-page="newLog">


＋ 新增施工日志


</button>





<div id="logList">


暂无记录


</div>





</section>









<!-- 新增日志 -->

<section id="newLog"
class="page">


<div class="top">


<button class="back"
data-back="logs">

← 返回

</button>


<h2>
新增施工日志
</h2>


</div>





<select id="logStage">


<option>
拆改
</option>

<option>
水电
</option>

<option>
防水
</option>

<option>
泥瓦
</option>

<option>
木工
</option>

<option>
油漆
</option>

<option>
安装
</option>

<option>
软装
</option>


</select>





<textarea
id="logContent"
placeholder="记录施工内容">
</textarea>






<input
id="logImages"
type="file"
accept="image/*"
multiple>






<button id="saveLog"
class="primary">

保存日志

</button>




</section>









<!-- 日志详情 -->

<section id="detail"
class="page">


<div class="top">


<button class="back"
data-back="logs">

← 返回

</button>


<h2>
日志详情
</h2>


</div>





<div id="detailBox"
class="card">

</div>




</section>









<!-- 档案 -->

<section id="archive"
class="page">


<div class="top">


<button class="back"
data-back="home">

← 返回

</button>


<h2>
档案
</h2>


</div>





<div class="card">

📦 材料档案

</div>


<div class="card">

📄 合同档案

</div>


<div class="card">

💰 财务记录

</div>



</section>









<!-- 问题 -->

<section id="issues"
class="page">


<div class="top">


<button class="back"
data-back="home">

← 返回

</button>


<h2>
问题清单
</h2>


</div>



<div class="card">

暂无问题

</div>



</section>









<!-- 我的 -->

<section id="mine"
class="page">


<div class="top">


<button class="back"
data-back="home">

← 返回

</button>


<h2>
我的
</h2>


</div>



<div class="card">

项目设置

</div>


<div class="card">

数据备份

</div>



</section>






</main>







<!-- 底部导航 -->

<nav>


<button data-page="home">

首页

</button>


<button data-page="logs">

日志

</button>


<button data-page="archive">

档案

</button>


<button data-page="issues">

问题

</button>


<button data-page="mine">

我的

</button>


</nav>







</div>





<script src="js/storage.js"></script>

<script src="js/logs.js"></script>

<script src="js/app.js"></script>



</body>


</html>
