<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>猪窝 1PIG'S</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- 启动页 -->

<div id="splash" class="splash">

<div class="logo-box">

<div class="logo-text">
猪窝
</div>

<div class="logo-en">
1PIG'S
</div>

<div class="line"></div>

<div>
记录家的每一步
</div>

<div class="small">
BUILDING OUR HOME
</div>

</div>

</div>





<div id="app" class="app hidden">



<header>

<h1>猪窝</h1>

<p>我的家</p>

</header>



<main>



<section id="home" class="page active">


<div class="card">

<h2>
我的家
</h2>

<div class="stage">
准备装修
</div>

<div class="muted">
装修第0天
</div>

</div>




<div class="card">

<div class="muted">
已花费金额
</div>

<div class="number">
¥0
</div>

</div>





<div class="card">

<h3>
最近动态
</h3>


<div id="recent">

暂无记录

</div>


</div>





<button id="openLog"
class="primary">

＋ 新增施工日志

</button>


</section>







<section id="logs" class="page">


<h2>
施工日志
</h2>


<div id="logList">

暂无记录

</div>


</section>








<section id="archive" class="page">


<div class="card">

<h2>
档案
</h2>


<p>
📦 材料档案
</p>


<p>
📄 合同档案
</p>


<p>
💰 财务流水
</p>


</div>


</section>






<section id="me" class="page">


<div class="card">

<h2>
我的
</h2>


<p>
房屋管理
</p>


<p>
数据备份
</p>


</div>


</section>






</main>






<nav>


<button data-page="home">
首页
</button>


<button data-page="logs">
日志
</button>


<button data-page="archive">
档案
</button>


<button data-page="me">
我的
</button>


</nav>






<!-- 日志弹窗 -->


<div id="logModal" class="modal hidden">


<div class="modal-box">


<h2>
新增施工日志
</h2>



<select id="stage">

<option>
拆改
</option>

<option>
水电
</option>

<option>
防水
</option>

<option>
泥瓦
</option>

<option>
安装
</option>

</select>




<textarea id="content"
placeholder="记录施工内容">

</textarea>



<input id="photos"
type="file"
accept="image/*"
multiple>



<button id="saveLog"
class="primary">

保存

</button>



<button id="closeLog">

取消

</button>



</div>


</div>





</div>


<script src="app.js"></script>


</body>

</html>
