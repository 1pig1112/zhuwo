<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>猪窝 1PIG'S</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- 启动页 -->

<div id="splash" class="splash">

<div class="logo-box">

<div class="logo-text">
猪窝
</div>

<div class="logo-en">
1PIG'S
</div>

<div class="line"></div>

<div>
记录家的每一步
</div>

<div class="small">
BUILDING OUR HOME
</div>

</div>

</div>




<div id="app" class="hidden">


<header>

<h1>
猪窝
</h1>

<p>
我的家
</p>

</header>





<main>



<!-- 首页 -->

<section id="home" class="page active">


<div class="card">

<h2>
我的家
</h2>


<div class="stage">
准备装修
</div>


<div class="muted">
装修第0天
</div>


</div>





<div class="card">

<div class="muted">
已花费金额
</div>


<div class="number">
¥0
</div>


</div>





<div class="card">


<h3>
最近动态
</h3>


<div id="recent">

暂无记录

</div>


</div>





<button id="openLog"
class="primary">

＋ 新增施工日志

</button>



</section>








<!-- 施工日志列表 -->

<section id="logs" class="page">


<div class="top-bar">

<button class="back-btn"
data-back="home">

← 返回

</button>


<h2>
施工日志
</h2>


</div>





<button id="newLog"
class="primary">

＋ 新建记录

</button>





<div id="logList">

暂无记录

</div>



</section>








<!-- 新增日志页面 -->

<section id="newLogPage"
class="page">


<div class="top-bar">

<button class="back-btn"
data-back="logs">

← 返回

</button>


<h2>
新增日志
</h2>


</div>





<select id="stage">


<option>
拆改
</option>


<option>
水电
</option>


<option>
防水
</option>


<option>
泥瓦
</option>


<option>
木工
</option>


<option>
安装
</option>


<option>
软装
</option>


</select>





<textarea id="content"
placeholder="记录施工内容">

</textarea>





<input id="photos"
type="file"
accept="image/*"
multiple>





<button id="saveLog"
class="primary">

保存记录

</button>



</section>








<!-- 日志详情 -->

<section id="detail"
class="page">


<div class="top-bar">


<button class="back-btn"
data-back="logs">

← 返回

</button>


<h2>
日志详情
</h2>


</div>




<div id="detailContent"
class="card">

</div>



</section>








<!-- 档案 -->

<section id="archive"
class="page">


<div class="top-bar">


<h2>
档案
</h2>


</div>



<div class="card">

📦 材料档案

</div>


<div class="card">

📄 合同档案

</div>


<div class="card">

💰 财务流水

</div>



</section>








<!-- 我的 -->

<section id="me"
class="page">


<div class="top-bar">


<h2>
我的
</h2>


</div>



<div class="card">

房屋管理

</div>


<div class="card">

数据备份

</div>



</section>






</main>







<nav>


<button data-page="home">

首页

</button>


<button data-page="logs">

日志

</button>


<button data-page="archive">

档案

</button>


<button data-page="me">

我的

</button>


</nav>





</div>



<script src="js/storage.js"></script>

<script src="js/logs.js"></script>

<script src="js/app.js"></script>


</body>


</html>
