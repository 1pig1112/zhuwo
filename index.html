<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>猪窝</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

<div class="pig-avatar">
🐷
</div>


<div>

<h1>
猪窝
</h1>

<p>
我的装修小管家 🌸
</p>


</div>


</header>




<main>



<!-- 首页 -->

<section id="home" class="page active">


<div class="welcome card">


<h2>
早上好呀，主人 🌸
</h2>


<p id="dayText">
今天也要让新家慢慢变好
</p>


</div>





<div class="home-card house-card">


<div class="title-row">

<h2>
🏠 我的新家
</h2>


<span>
🐷
</span>

</div>



<div class="info">

<div>

装修天数

<b id="days">
18天
</b>

</div>



<div>

当前阶段

<b id="stage">
水电施工
</b>

</div>


</div>



<div class="progress-box">


<div class="progress">

<div id="progress">
</div>

</div>


<p>

装修进度

<span id="progressText">
45%

</span>

</p>


</div>


</div>







<div class="card reminder">


<h2>
💗 今日提醒
</h2>


<div class="bubble">
🐷 记得拍水电管线照片哦
</div>


<div class="bubble">
🐷 确认厨房插座位置
</div>


<div class="bubble">
🐷 准备下一次验收
</div>


</div>








<div class="quick-title">

常用功能

</div>





<div class="quick-grid">



<div class="quick-card"
onclick="openPage('calendar')">

<div>
📅
</div>

<b>
装修日历
</b>

<p>
每天记录
</p>


</div>





<div class="quick-card"
onclick="openPage('work')">


<div>
🔨
</div>

<b>
我的工地
</b>

<p>
施工进度
</p>


</div>






<div class="quick-card"
onclick="openPage('money')">


<div>
💰
</div>

<b>
装修账本
</b>

<p>
付款记录
</p>


</div>





<div class="quick-card"
onclick="openPage('mine')">


<div>
🐷
</div>

<b>
我的资料
</b>

<p>
文件管理
</p>


</div>



</div>



</section>
<!-- 日历页面 -->

<section id="calendar" class="page">


<div class="page-title">

<button onclick="backHome()">
‹
</button>

<h2>
📅 装修日历
</h2>

</div>



<div class="card calendar-card">


<h3 id="monthTitle">
2026年8月
</h3>



<div class="calendar-grid">

<div>日</div>
<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>


</div>


<div id="calendarDays"
class="calendar-days">

</div>



</div>





<div class="card">


<h3>
🐷 今日记录
</h3>


<button class="pink-btn"
onclick="newDiary()">

+ 新建今天记录

</button>


</div>




<div id="historyList">


</div>




</section>






<!-- 单日记录详情 -->

<section id="record" class="page">


<div class="page-title">

<button onclick="openPage('calendar')">
‹
</button>


<h2 id="recordTitle">

今日装修记录

</h2>


</div>





<div class="card">


<h3>
🔨 施工阶段
</h3>


<select id="recordStage">

<option>
拆改
</option>

<option>
水电施工
</option>

<option>
防水
</option>

<option>
瓦工
</option>

<option>
木工
</option>

<option>
油工
</option>

<option>
安装
</option>


</select>


</div>






<div class="card">


<h3>
✅ 今日完成

</h3>


<textarea id="recordDone"
placeholder="例如：厨房水电布管完成">

</textarea>



</div>







<div class="card">


<h3>
⚠️ 发现问题

</h3>


<textarea id="recordProblem"
placeholder="例如：插座高度需要确认">

</textarea>


</div>






<div class="card">


<h3>
💬 沟通记录

</h3>


<textarea id="recordChat"
placeholder="装修公司说了什么">

</textarea>


</div>







<div class="card">


<h3>
💰 今日费用

</h3>


<input id="recordMoney"
type="number"
placeholder="输入金额">


</div>







<div class="card">


<h3>
📷 现场照片

</h3>


<button class="pink-btn">

添加照片

</button>


<div id="photoBox">

</div>


</div>







<button class="save-btn"
onclick="saveRecord()">

🐷 保存今天记录

</button>



</section>
